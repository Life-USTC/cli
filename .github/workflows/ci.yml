name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned server commit
        id: server-openapi-ref
        run: echo "ref=$(./scripts/openapi-contract pinned-sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout server OpenAPI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Life-USTC/server
          ref: ${{ steps.server-openapi-ref.outputs.ref }}
          path: .openapi-server
          # The pin is checked for reachability from server main, which needs
          # real history: a shallow checkout cannot answer the question, and
          # `openapi-contract verify-reachable` refuses to guess.
          fetch-depth: 0

      - name: Fetch server main for the pin reachability check
        run: |
          git -C .openapi-server fetch --no-tags --quiet origin \
            +refs/heads/main:refs/remotes/origin/main
          git -C .openapi-server rev-parse --verify refs/remotes/origin/main >/dev/null

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check generated code is up-to-date
        run: |
          make check-openapi-sync OPENAPI_SERVER_DIR=.openapi-server
          make generate
          git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
